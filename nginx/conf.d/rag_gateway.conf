# ==============================================================================
# 企业级 RAG 生产环境统一入口网关 (Nginx Unified Gateway)
# 职责：同源流量收敛、多后端上游负载均衡、边界访问控制、洪峰限流与流量监控
# ==============================================================================

upstream java_admin_backend {
    least_conn;
    server java-admin-service:8080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream python_rag_backend {
    least_conn;
    server rag-backend:8001 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream keycloak_sso_backend {
    least_conn;
    server rag-keycloak:8080 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # 对齐后端 MAX_UPLOAD_SIZE_MB=100
    client_max_body_size 100M;
    client_body_timeout  120s;

    # 单 IP 最大并发连接保护
    limit_conn rag_conn_per_ip 64;

    # 全局基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Request-Id $trace_request_id always;

    # --------------------------------------------------------------------------
    # 1. 网关自身健康检查与内网实时流量监控 (stub_status)
    # --------------------------------------------------------------------------
    location = /gateway/healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","component":"nginx-unified-gateway"}';
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # --------------------------------------------------------------------------
    # 2. 边界访问控制：物理封禁内部凭据端点、裸静态目录与敏感隐藏文件
    # --------------------------------------------------------------------------
    location ^~ /api/admin/internal/ {
        default_type application/json;
        return 403 '{"detail":"Forbidden: Internal service endpoint is blocked by gateway."}';
    }

    location ^~ /static/ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --------------------------------------------------------------------------
    # 3. Keycloak 企业统一身份认证端点转发
    # --------------------------------------------------------------------------
    location ~ ^/(realms|resources|js)/ {
        limit_req zone=rag_auth_rate burst=30 nodelay;

        proxy_pass http://keycloak_sso_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto_or_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "proto=$scheme;host=$host";
        proxy_set_header X-Request-Id $trace_request_id;
    }

    # --------------------------------------------------------------------------
    # 4. Java RBAC 鉴权中台路由 (OIDC 授权码回调、JWKS 公钥集、会话换短票)
    # --------------------------------------------------------------------------
    location ~ ^/(oauth2|login/oauth2)/ {
        limit_req zone=rag_auth_rate burst=20 nodelay;

        proxy_pass http://java_admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto_or_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "proto=$scheme;host=$host";
        proxy_set_header X-Request-Id $trace_request_id;

        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ^~ /api/admin/ {
        limit_req zone=rag_auth_rate burst=20 nodelay;

        proxy_pass http://java_admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto_or_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Forwarded "proto=$scheme;host=$host";
        proxy_set_header X-Request-Id $trace_request_id;

        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /.well-known/jwks.json {
        limit_req zone=rag_api_rate burst=30 nodelay;

        proxy_pass http://java_admin_backend/.well-known/jwks.json;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto_or_scheme;
        proxy_set_header X-Request-Id $trace_request_id;
    }

    # --------------------------------------------------------------------------
    # 5. Python FastAPI 核心业务引擎 (RAG 检索、SSE 流式问答、文档入库与受限流预览)
    # --------------------------------------------------------------------------
    location = /health {
        access_log off;
        proxy_pass http://python_rag_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/ {
        limit_req zone=rag_api_rate burst=80 nodelay;

        proxy_pass http://python_rag_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto_or_scheme;
        proxy_set_header X-Request-Id $trace_request_id;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # 适配大模型深度推理与大体积文档流式上传
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        # 关闭缓冲与代理缓存：保障 SSE 打字机毫秒级推送与私有文档零落盘缓存
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
    }

    # --------------------------------------------------------------------------
    # 6. Vue 3 前端静态资源托管 (Hashed 资源长效缓存，入口 HTML 严禁缓存)
    # --------------------------------------------------------------------------
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Request-Id $trace_request_id always;
    }
}
