user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # 生成或透传全局链路追踪标识 X-Request-Id
    map $http_x_request_id $trace_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    # 优先信任上游 TLS 终结层（如 Cloudflare Tunnel）传入的 X-Forwarded-Proto，未传则取当前 $scheme
    map $http_x_forwarded_proto $http_x_forwarded_proto_or_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    # WebSocket / Connection 升级协议映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      "";
    }

    # 结构化脱敏 JSON 访问日志：仅记录 $uri（物理剥离 ?query_string），根除凭据/票据落盘隐患
    log_format rag_gateway_json escape=json
        '{'
            '"time":"$time_iso8601",'
            '"request_id":"$trace_request_id",'
            '"client_ip":"$remote_addr",'
            '"xff":"$http_x_forwarded_for",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"protocol":"$server_protocol",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent"'
        '}';

    access_log  /var/log/nginx/access.log rag_gateway_json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 网关级分布式流量护栏（防网络洪峰与高频探测；细粒度账号级限流由后端 Redis 执行）
    limit_conn_zone $binary_remote_addr zone=rag_conn_per_ip:10m;
    limit_req_zone  $binary_remote_addr zone=rag_auth_rate:10m rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=rag_api_rate:10m  rate=40r/s;
    limit_req_status 429;
    limit_conn_status 429;

    # 静态与 JSON 载荷压缩（SSE text/event-stream 不纳入 gzip_types，确保流式打字机零延迟）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
