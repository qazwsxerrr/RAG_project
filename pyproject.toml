# pyproject.toml —— 项目元信息、依赖声明与测试配置
# 项目名 rag-kb，版本 2.0.0，requires-python >=3.11

[project]
name = "rag-kb"
version = "2.0.0"
description = "企业级多模态 RAG 知识库系统 (基于 LangGraph 1.2+)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "openai>=1.20.0",
    "alibabacloud-oss-v2>=0.1.0",
    "jieba>=0.42.1",
    "requests>=2.31.0",
    "colorlog>=6.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
pythonpath = ["backend/src", "src"]
asyncio_mode = "strict"
